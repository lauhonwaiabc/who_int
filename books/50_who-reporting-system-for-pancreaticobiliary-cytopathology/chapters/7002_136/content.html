<h1>7.0.0.2 Definition</h1>
<div class="contribution"><p >A specimen categorized as &ldquo;Pancreaticobiliary neoplasm, high-risk/grade (PaN-high)&rdquo; has features of an intraductal and/or cystic neoplasm with high-grade epithelial atypia.</p></div>
