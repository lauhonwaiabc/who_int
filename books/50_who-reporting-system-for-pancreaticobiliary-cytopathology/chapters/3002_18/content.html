<h1>3.0.0.2 Definition</h1>
<div class="contribution"><p >A specimen categorized as "Insufficient/Inadequate/Non-diagnostic" is one that for qualitative and/or quantitative reasons does not permit a diagnosis of the targeted lesion.</p></div>
