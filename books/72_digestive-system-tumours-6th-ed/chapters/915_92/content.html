<h3>Figures</h3>
<figure id="att-44586"><img src="https://huggingface.co/datasets/lauhonwaiabc/who-tumour-images/resolve/main/books/72_digestive-system-tumours-6th-ed/chapters/915_92/images/44586.jpg" alt="&lt;p&gt;Combined hepatocellular-cholangiocarcinoma&lt;/p&gt;"><figcaption><strong>&lt;p&gt;Combined hepatocellular-cholangiocarcinoma&lt;/p&gt;</strong> <p>Unequivocal cholangiocytic and hepatocytic areas of differentiation at low magnification.&nbsp;</p></figcaption></figure>
<figure id="att-44587"><img src="https://huggingface.co/datasets/lauhonwaiabc/who-tumour-images/resolve/main/books/72_digestive-system-tumours-6th-ed/chapters/915_92/images/44587.jpg" alt="&lt;p&gt;Combined hepatocellular-cholangiocarcinoma&lt;/p&gt;"><figcaption><strong>&lt;p&gt;Combined hepatocellular-cholangiocarcinoma&lt;/p&gt;</strong> <p>Hepatocytic differentiation area.</p></figcaption></figure>
<figure id="att-44588"><img src="https://huggingface.co/datasets/lauhonwaiabc/who-tumour-images/resolve/main/books/72_digestive-system-tumours-6th-ed/chapters/915_92/images/44588.jpg" alt="&lt;p&gt;Combined hepatocellular-cholangiocarcinoma&lt;/p&gt;"><figcaption><strong>&lt;p&gt;Combined hepatocellular-cholangiocarcinoma&lt;/p&gt;</strong> <p>Cholangiocytic differentiation area.</p></figcaption></figure>
<figure id="att-44590"><img src="https://huggingface.co/datasets/lauhonwaiabc/who-tumour-images/resolve/main/books/72_digestive-system-tumours-6th-ed/chapters/915_92/images/44590.jpg" alt="&lt;p&gt;Intermediate cell carcinoma&lt;/p&gt;"><figcaption><strong>&lt;p&gt;Intermediate cell carcinoma&lt;/p&gt;</strong> <p>Monotonous tumour cells with scant cytoplasm showing intermediate morphological features between hepatocytes and cholangiocytes are arranged in strands in an abundant fibrous stroma.</p></figcaption></figure>
<figure id="att-44885"><img src="https://huggingface.co/datasets/lauhonwaiabc/who-tumour-images/resolve/main/books/72_digestive-system-tumours-6th-ed/chapters/915_92/images/44885.jpg" alt="&lt;p&gt;Combined hepatocellular-cholangiocarcinoma, transitional zone&lt;/p&gt;"><figcaption><strong>&lt;p&gt;Combined hepatocellular-cholangiocarcinoma, transitional zone&lt;/p&gt;</strong> <p>Small uniform tumour cells (so-called cancer stem cells) are located at the periphery of hepatocellular carcinoma trabeculae (at the left) or as small nests (at the right) in the transitional zone between cholangiocytic and hepatocytic differentiation components.</p></figcaption></figure>
<figure id="att-45317"><img src="https://huggingface.co/datasets/lauhonwaiabc/who-tumour-images/resolve/main/books/72_digestive-system-tumours-6th-ed/chapters/915_92/images/45317.jpg" alt="&lt;p&gt;Intermediate cell carcinoma&lt;/p&gt;"><figcaption><strong>&lt;p&gt;Intermediate cell carcinoma&lt;/p&gt;</strong> <p>On H&amp;E the tumoural cells have a morphology intermediate between a hepatocyte and a cholangiocyte.&nbsp;</p></figcaption></figure>
<figure id="att-45318"><img src="https://huggingface.co/datasets/lauhonwaiabc/who-tumour-images/resolve/main/books/72_digestive-system-tumours-6th-ed/chapters/915_92/images/45318.jpg" alt="&lt;p&gt;Intermediate cell carcinoma&lt;/p&gt;"><figcaption><strong>&lt;p&gt;Intermediate cell carcinoma&lt;/p&gt;</strong> <p>Immunohistochemistry demonstrates the biphenotypic nature of the tumour at the cellular level: the same cell expresses both hepatocytic markers, such as arginase-1 (ARG1), shown here, and cholangiocytic markers.&nbsp;</p></figcaption></figure>
<figure id="att-45319"><img src="https://huggingface.co/datasets/lauhonwaiabc/who-tumour-images/resolve/main/books/72_digestive-system-tumours-6th-ed/chapters/915_92/images/45319.jpg" alt="&lt;p&gt;Intermediate cell carcinoma&lt;/p&gt;"><figcaption><strong>&lt;p&gt;Intermediate cell carcinoma&lt;/p&gt;</strong> <p>Immunohistochemistry demonstrates the biphenotypic nature of the tumour at the cellular level: the same cell expresses both hepatocytic markers, such as AFP, shown here,&nbsp;and cholangiocytic markers.</p></figcaption></figure>
<figure id="att-45320"><img src="https://huggingface.co/datasets/lauhonwaiabc/who-tumour-images/resolve/main/books/72_digestive-system-tumours-6th-ed/chapters/915_92/images/45320.jpg" alt="&lt;p&gt;Intermediate cell carcinoma&lt;/p&gt;"><figcaption><strong>&lt;p&gt;Intermediate cell carcinoma&lt;/p&gt;</strong> <p>Immunohistochemistry demonstrates the biphenotypic nature of the tumour at the cellular level: the same cell expresses both hepatocytic markers, such as arginase-1 (ARG1 and AFP, and cholangiocytic markers, such as CK19&nbsp;(shown here).</p></figcaption></figure>
